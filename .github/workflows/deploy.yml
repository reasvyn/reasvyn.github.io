name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          dotfiles: true

      - name: Setup VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_PATH: /var/www/reasvyn.web.id
          RELEASE_ID: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "sudo -n mkdir -p '$VPS_PATH/releases/$RELEASE_ID'"
          rsync -az --delete --omit-dir-times --exclude='CNAME' --exclude='.nojekyll' --rsync-path="sudo -n rsync" -e "ssh -p $VPS_PORT" dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/releases/$RELEASE_ID/"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "sudo -n ln -sfn '$VPS_PATH/releases/$RELEASE_ID' '$VPS_PATH/current' && sudo -n find '$VPS_PATH/releases' -mindepth 1 -maxdepth 1 -type d ! -name '$RELEASE_ID' -printf '%T@ %p\\n' | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r sudo -n rm -rf"
